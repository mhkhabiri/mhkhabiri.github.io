<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — صفحه پیدا نشد | Mohammad Hossein Khabiri</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#080b0a" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      background-color: #080b0a;
      color: #f4f7f5;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #0f1412;
      border: 1px solid rgba(255, 255, 255, 0.085);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
    }
    .code {
      font-size: 56px;
      font-weight: 700;
      color: #34d399;
      line-height: 1;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }
    h1 { font-size: 19px; margin-top: 16px; color: #f4f7f5; }
    p { font-size: 13px; color: #adbab3; margin-top: 10px; line-height: 1.75; }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 11px 22px;
      border-radius: 10px;
      background: #34d399;
      color: #04120b;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      transition: transform 150ms cubic-bezier(0.23, 1, 0.32, 1), background-color 180ms ease;
    }
    a:hover { background: #4ade9e; }
    a:active { transform: scale(0.97); }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code" dir="ltr">404</div>
    <h1>این صفحه پیدا نشد</h1>
    <p>آدرسی که وارد کرده‌اید وجود ندارد یا جابه‌جا شده است.<br /><span dir="ltr">The requested page could not be found.</span></p>
    <a href="/">بازگشت به صفحهٔ اصلی</a>
  </main>
</body>
</html>
