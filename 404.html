<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — صفحه پیدا نشد | Mohammad Hossein Khabiri</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#040a07" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      background: #040a07;
      color: #e6f4ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: linear-gradient(160deg, rgba(12, 27, 19, 0.88) 0%, rgba(7, 15, 11, 0.96) 100%);
      border: 1px solid rgba(46, 242, 149, 0.25);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 24px 55px -18px rgba(0, 0, 0, 0.85);
    }
    .code {
      font-size: 64px;
      font-weight: 800;
      color: #2ef295;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    h1 { font-size: 20px; margin-top: 14px; color: #fff; }
    p { font-size: 13px; color: #94a3b8; margin-top: 10px; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 22px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2ef295 0%, #10b981 100%);
      color: #03110a;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
    }
    a:hover { filter: brightness(1.06); }
  </style>
</head>
<body>
  <main class="card">
    <div class="code" dir="ltr">404</div>
    <h1>این صفحه پیدا نشد</h1>
    <p>آدرسی که وارد کرده‌اید وجود ندارد یا جابه‌جا شده است.<br /><span dir="ltr">The requested page could not be found.</span></p>
    <a href="/">بازگشت به صفحهٔ اصلی</a>
  </main>
</body>
</html>
